apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaccine-efficacy-app
  labels:
    app: vaccine-efficacy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vaccine-efficacy
  template:
    metadata:
      labels:
        app: vaccine-efficacy
    spec:
      containers:
      - name: vaccine-efficacy
        image: vaccine-efficacy-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: upload-folder
          mountPath: /app/Upload_Folder
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: upload-folder
        persistentVolumeClaim:
          claimName: upload-folder-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vaccine-efficacy-service
spec:
  selector:
    app: vaccine-efficacy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: upload-folder-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi 