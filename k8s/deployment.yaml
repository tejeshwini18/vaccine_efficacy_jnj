apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaccine-efficacy-app
  labels:
    app: vaccine-efficacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaccine-efficacy
  template:
    metadata:
      labels:
        app: vaccine-efficacy
    spec:
      containers:
      - name: vaccine-efficacy
        image: vaccine-efficacy-app:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: upload-folder
          mountPath: /app/Upload_Folder
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        command: ["python"]
        args: ["-m", "http.server", "8000"]
      volumes:
      - name: upload-folder
        persistentVolumeClaim:
          claimName: upload-folder-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vaccine-efficacy-service
spec:
  selector:
    app: vaccine-efficacy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP 